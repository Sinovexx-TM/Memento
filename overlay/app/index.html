<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Memento Yomitan Overlay</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
    }
    #text-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }
    .ov-block {
        position: absolute;
        pointer-events: auto;
        color: transparent;
        cursor: default;
    }
    .ov-block.vertical {
        writing-mode: vertical-rl;
        text-orientation: upright;
    }
    .ov-line {
        display: block;
        white-space: pre;
        overflow: visible;
    }
    .ov-char {
        display: inline-block;
        block-size: 100%;
        text-align: center;
        vertical-align: top;
        overflow: visible;
    }
    /* Yomitan selects the word it found: show that over Memento's text */
    .ov-block ::selection {
        background: rgba(90, 140, 255, 0.38);
        color: transparent;
    }
    /* Settings > "Show overlay text": check the boxes line up */
    body.debug .ov-block {
        outline: 1px solid rgba(255, 80, 80, 0.7);
    }
    body.debug .ov-block,
    body.debug .ov-block ::selection {
        color: rgba(255, 70, 70, 0.75);
    }
    body.debug .ov-char {
        box-shadow: inset 0 0 0 1px rgba(80, 200, 255, 0.35);
    }
</style>
</head>
<body>
<div id="text-root"></div>
<script src="layout.js"></script>
<script src="renderer.js"></script>
</body>
</html>
